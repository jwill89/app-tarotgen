# TarotGen.io's one vhost file: the port-80 site, which sends every request on to https, and the
# port-443 site. Every deploy of the site (scripts/deploy.ps1) fills in the words between double
# underscores from its settings and installs the file as
# /etc/apache2/sites-available/<server name>.conf, enabling it and retiring any other enabled site
# that serves the same names (certbot's -le-ssl file, say). Apache keeps the previous state if
# its configtest refuses the new file.
#
# The web root is the document root: the SPA's dist/, the API and og.php sit side by side in it,
# and its .htaccess does the routing, refuses the server-side folders and sets the cache
# headers, so the directory allows overrides and symlinks (the rewrite rules need them). PHP
# runs through the PHP-FPM setup Apache already has for every site. The private data directory
# (.env and the database) is outside the web root, and SetEnv tells the app where: under
# PHP-FPM a php_value or env line in .htaccess is ignored.
#
# The certificate is a folder under /etc/letsencrypt/live whose certificate covers every name.

<VirtualHost *:80>
    ServerName __SERVER_NAME__
    ServerAlias __SERVER_ALIAS__

    RewriteEngine on
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName __SERVER_NAME__
    ServerAlias __SERVER_ALIAS__
    ServerAdmin __SERVER_ADMIN__

    DocumentRoot "__WEB_ROOT__"
    <Directory "__WEB_ROOT__">
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Logs go where every site's do, in the combined format; without these lines Debian sends
    # the access log to other_vhosts_access.log.
    ErrorLog /var/log/apache2/error.log
    CustomLog /var/log/apache2/access.log combined
    <IfModule mod_dir.c>
        DirectoryIndex index.php index.pl index.cgi index.html index.xhtml index.htm
    </IfModule>
    Protocols h2 h2c http/1.1

    SetEnv TAROT_DATA_DIR __DATA_DIR__

    # Cloudflare fronts every name. On connections from its addresses the visitor is who its
    # header names, so the address PHP sees, which the rate limits read, is the visitor and
    # not the edge. The list is the droplet's own (/etc/apache2/cloudflare-ips.txt), kept
    # current outside this repository.
    RemoteIPHeader CF-Connecting-IP
    RemoteIPTrustedProxyList /etc/apache2/cloudflare-ips.txt

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/__CERT_NAME__/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/__CERT_NAME__/privkey.pem
</VirtualHost>
</IfModule>
