name: CI

# Every gate job is one of the shared reusable workflows, at the release the
# shared/ submodule holds (the docs job fails if the two ever differ); the release job
# is this repo's own. The plugin package (plugin.yml) runs apart.
on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-progress run when newer commits are pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which areas this push or pull request changed: each job below runs when its area did,
  # docs always, and every job when CI's own files, shared/ or the Taskfile change
  # (changes.yml). `task shared:ci:changes` shows what a push would run.
  changes:
    uses: jwill89/shared-tooling/.github/workflows/changes.yml@v2.17.0
    permissions:
      contents: read
      actions: read
    with:
      ignore: '**/*.md LICENSE LICENSE.* .gitignore .gitmodules .markdownlint-cli2.jsonc .vscode/** .claude/** .idea/** plans/** docs/**'
      areas: |
        app: frontend/** backend/** !**/*.md
        plugin: plugin/** !**/*.md

  # The Vue SPA, with the Font Awesome Pro kit from its private registry (the
  # FONTAWESOME_NPM_TOKEN secret, written to ~/.npmrc for the install only). gen:check
  # fails if the generated API types differ from the committed OpenAPI spec;
  # test:coverage fails below the floor in vite.config.ts. web.yml runs npm audit itself.
  frontend:
    needs: changes
    if: fromJSON(needs.changes.outputs.areas).app
    uses: jwill89/shared-tooling/.github/workflows/web.yml@v2.17.0
    with:
      dir: frontend
      fontawesome: true
      scripts: gen:check type-check lint lint:css knip format:check test:coverage build
    secrets:
      FONTAWESOME_TOKEN: ${{ secrets.FONTAWESOME_NPM_TOKEN }}

  # The Slim API: advisories, composer.json, the OpenAPI document the attributes make,
  # normalize, the declared dependencies, PHP CS Fixer, Rector, the tests (unit and
  # HTTP, against Phinx's schema) with their coverage floor, and PHPStan level 8.
  backend:
    needs: changes
    if: fromJSON(needs.changes.outputs.areas).app
    uses: jwill89/shared-tooling/.github/workflows/php.yml@v2.17.0
    with:
      dir: backend
      php-version: '8.5'
      # The ext-* the code and its packages need: iconv for symfony/polyfill-mbstring,
      # openssl and gmp for lbuchs/webauthn, which declares none.
      extensions: ctype, curl, filter, gd, iconv, mbstring, pdo, pdo_sqlite, session, simplexml, openssl, gmp
      coverage: pcov
      commands: audit validate docs:check normalize:check deps:check lint rector:check test:coverage stan

  # The built SPA and the real API behind PHP's built-in server, routed as
  # production's .htaccess routes them, on a throwaway database
  # (frontend/playwright.config.ts), in the runner's Chrome. The main pages must pass
  # axe at WCAG 2.2 AA, and a guest's reading and card report must reach an admin.
  e2e:
    needs: [changes, frontend, backend]
    if: fromJSON(needs.changes.outputs.areas).app
    uses: jwill89/shared-tooling/.github/workflows/e2e.yml@v2.17.0
    with:
      dir: frontend
      fontawesome: true
      php-version: '8.5'
      php-extensions: ctype, curl, filter, gd, iconv, mbstring, pdo, pdo_sqlite, session, simplexml, openssl, gmp
      composer-dir: backend
    secrets:
      FONTAWESOME_TOKEN: ${{ secrets.FONTAWESOME_NPM_TOKEN }}

  # The FFXIV plugin and its window preview, built against Dalamud in Release with
  # warnings as errors (the shared analyzers, imported by plugin/Directory.Build.props);
  # dotnet format on all three projects; and the tests of the plugin's Core/, which run
  # with no Dalamud. The preview compiles the plugin's windows against Dalamud on its
  # own, so a window that stops compiling outside the plugin fails here.
  plugin:
    needs: changes
    if: fromJSON(needs.changes.outputs.areas).plugin
    uses: jwill89/shared-tooling/.github/workflows/dotnet.yml@v2.18.0
    with:
      projects: plugin/TarotGen.Plugin/TarotGen.Plugin.csproj plugin/TarotGen.Plugin.Preview/TarotGen.Plugin.Preview.csproj
      test-project: plugin/TarotGen.Plugin.Tests/TarotGen.Plugin.Tests.csproj
      warnings-as-errors: true

  # PSScriptAnalyzer, with the shared settings, on every tracked script.
  scripts:
    needs: changes
    if: fromJSON(needs.changes.outputs.areas).scripts
    uses: jwill89/shared-tooling/.github/workflows/pwsh.yml@v2.17.0

  # markdownlint, the shared .editorconfig/.gitattributes, and the workflow refs.
  docs:
    uses: jwill89/shared-tooling/.github/workflows/docs.yml@v2.17.0

  # OSV-Scanner over every lockfile. An osv-scanner.toml beside a lockfile passes over the
  # advisories that reach only lint, test or build tooling.
  osv:
    needs: changes
    if: fromJSON(needs.changes.outputs.areas).lockfiles
    uses: jwill89/shared-tooling/.github/workflows/osv.yml@v2.17.0

  # On a push to main, AFTER the gate passes, tag + release the project version
  # if it has no release yet. Tag = v<version> (frontend/package.json); release
  # body = the CHANGELOG "## [<version>]" section — so a green version bump
  # auto-publishes a release linked to its notes. Idempotent: a version already
  # released is skipped, so ordinary pushes are a no-op.
  release:
    name: Tag + release (main, on version bump)
    needs: [changes, frontend, backend, e2e, plugin, scripts, docs, osv]
    if: ${{ !failure() && !cancelled() && (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
    # A pull request from a fork runs on GitHub's runners, never on a self-hosted one.
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-24.04' || vars.CI_RUNNER || 'ubuntu-24.04' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need existing tags to detect what's already released

      - name: Tag + release on version bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/release.sh

  # When a job fails, one report of what failed and where: at the head of the run's page,
  # and as the ci-report artifact `task shared:ci:report` prints (report.yml).
  report:
    needs: [changes, frontend, backend, e2e, plugin, scripts, docs, osv, release]
    if: failure()
    uses: jwill89/shared-tooling/.github/workflows/report.yml@v2.17.0
    permissions:
      contents: read
      actions: read
