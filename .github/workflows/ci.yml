name: CI

# Every gate job is one of shared-tooling's reusable workflows, at the release the
# shared/ submodule holds (the docs job fails if the two ever differ); the release job
# is TarotGen's own. CodeQL (codeql.yml) and the plugin package (plugin.yml) run apart.
on:
  push:
    branches: [main]
  pull_request:

# Cancel an in-progress run when newer commits are pushed to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The Vue SPA, with the Font Awesome Pro kit from its private registry (the
  # FONTAWESOME_NPM_TOKEN secret, written to ~/.npmrc for the install only). gen:check
  # fails if the generated API types differ from the committed OpenAPI spec;
  # test:coverage fails below the floor in vite.config.ts. web.yml runs the audit itself.
  frontend:
    uses: jwill89/shared-tooling/.github/workflows/web.yml@v2.1.4
    with:
      dir: frontend
      fontawesome: true
      scripts: gen:check type-check lint lint:css knip format:check test:coverage build
    secrets:
      FONTAWESOME_TOKEN: ${{ secrets.FONTAWESOME_NPM_TOKEN }}

  # The Slim API: advisories, composer.json, the OpenAPI document the attributes make,
  # normalize, the declared dependencies, PHP CS Fixer, Rector, the tests (unit and
  # HTTP, against Phinx's schema) with their coverage floor, and PHPStan level 8.
  backend:
    uses: jwill89/shared-tooling/.github/workflows/php.yml@v2.1.4
    with:
      dir: backend
      php-version: '8.5'
      # The ext-* the code and its packages need: iconv for symfony/polyfill-mbstring,
      # openssl and gmp for lbuchs/webauthn, which declares none.
      extensions: ctype, curl, filter, gd, iconv, mbstring, pdo, pdo_sqlite, session, simplexml, openssl, gmp
      coverage: pcov
      commands: audit validate docs:check normalize:check deps:check lint rector:check test:coverage stan

  # The built SPA and the real API behind PHP's built-in server, routed as
  # production's .htaccess routes them, on a throwaway database
  # (frontend/playwright.config.ts), in the runner's Chrome. The main pages must pass
  # axe at WCAG 2.2 AA, and a guest's reading and card report must reach an admin.
  e2e:
    needs: [frontend, backend]
    uses: jwill89/shared-tooling/.github/workflows/e2e.yml@v2.1.4
    with:
      dir: frontend
      fontawesome: true
      php-version: '8.5'
      php-extensions: ctype, curl, filter, gd, iconv, mbstring, pdo, pdo_sqlite, session, simplexml, openssl, gmp
      composer-dir: backend
    secrets:
      FONTAWESOME_TOKEN: ${{ secrets.FONTAWESOME_NPM_TOKEN }}

  # The FFXIV plugin, built against Dalamud in Release with warnings as errors (the
  # shared analyzers, imported by plugin/Directory.Build.props), and dotnet format.
  plugin:
    uses: jwill89/shared-tooling/.github/workflows/dotnet.yml@v2.1.4
    with:
      projects: plugin/TarotGen.Plugin/TarotGen.Plugin.csproj
      warnings-as-errors: true

  # PSScriptAnalyzer, with the shared settings, on every tracked script.
  scripts:
    uses: jwill89/shared-tooling/.github/workflows/pwsh.yml@v2.1.4

  # markdownlint, the shared .editorconfig/.gitattributes, and the workflow refs.
  docs:
    uses: jwill89/shared-tooling/.github/workflows/docs.yml@v2.1.4

  # On a push to main, AFTER the gate passes, tag + release the project version
  # if it has no release yet. Tag = v<version> (frontend/package.json); release
  # body = the CHANGELOG "## [<version>]" section — so a green version bump
  # auto-publishes a release linked to its notes. Idempotent: a version already
  # released is skipped, so ordinary pushes are a no-op.
  release:
    name: Tag + release (main, on version bump)
    needs: [frontend, backend, e2e, plugin, scripts, docs]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # need existing tags to detect what's already released

      - name: Tag + release on version bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/scripts/release.sh
