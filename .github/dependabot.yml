# Weekly dependency updates, grouped so a quiet week is one pull request per
# ecosystem: minors and patches together, majors one by one (they can need code
# changes).
#
# Dependabot can't read Actions secrets. Its jobs, and CI on its pull requests,
# need FONTAWESOME_NPM_TOKEN (the Pro icon registry) added again as a Dependabot
# secret (Settings > Secrets and variables > Dependabot). The shared submodule is
# public, so cloning the repo with it needs no token.
version: 2
registries:
  # frontend/.npmrc names this registry for the @fortawesome and @awesome.me scopes;
  # Dependabot adds the token. No `scope:` here: with one, Dependabot writes its own
  # .npmrc instead of the committed one, which loses install-links=true and records
  # the shared packages as links, so `npm ci` fails.
  fontawesome:
    type: npm-registry
    url: https://npm.fontawesome.com
    token: ${{ secrets.FONTAWESOME_NPM_TOKEN }}
updates:
  - package-ecosystem: npm
    directory: /frontend
    registries:
      - fontawesome
    schedule:
      interval: weekly
      day: monday
    groups:
      npm-minor:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Held on purpose: TypeScript stays on 6.x until Vue's tooling (vue-tsc)
      # supports TypeScript 7.1.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # vue-tsc 3.3.14 turns a `//` in a static attribute (placeholder="https://") into
      # broken virtual code, which stops it checking the rest of that template
      # (held at 3.3.13). Only that version: the fix comes through.
      - dependency-name: vue-tsc
        versions: ['3.3.14']
      # The tools the shared lint/web config owns move to a new major together with
      # the plugins and configs that must match, and reach here with
      # `task shared:update`; a plugin of our own for one moves with it. Minors and
      # patches still come here.
      - dependency-name: eslint
        update-types: ['version-update:semver-major']
      - dependency-name: 'eslint-*'
        update-types: ['version-update:semver-major']
      - dependency-name: prettier
        update-types: ['version-update:semver-major']
      - dependency-name: stylelint
        update-types: ['version-update:semver-major']
      - dependency-name: 'stylelint-*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: composer
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    groups:
      composer-minor:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: nuget
    directory: /plugin/TarotGen.Plugin
    schedule:
      interval: weekly
      day: monday
    groups:
      dotnet:
        patterns: ['*']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
