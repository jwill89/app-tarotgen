version: '3'

# Day-to-day commands; `task` alone lists them. CI (.github/workflows/ci.yml) runs the same checks.

# The shared tasks, from the shared submodule (shared:lint:scripts, shared:lint:md,
# shared:update and the rest).
includes:
  shared: ./shared/repo/Taskfile.yml

tasks:
  default:
    silent: true
    cmds:
      - task --list

  setup:
    desc: Install the frontend's and backend's dependencies (run `git submodule update --init` first; the Font Awesome token goes in ~/.npmrc)
    cmds:
      # --prefer-offline: the Font Awesome Pro kit installs from npm's cache unless the lockfile changed.
      - cd frontend && npm ci --prefer-offline
      - cd backend && composer install

  dev:
    desc: Run the PHP API on :80 and the Vite dev server on :5173 together
    deps: [dev:backend, dev:frontend]

  dev:backend:
    dir: backend
    env:
      # Composer stops a script after five minutes by default.
      COMPOSER_PROCESS_TIMEOUT: '0'
    cmds:
      - composer dev

  dev:frontend:
    dir: frontend
    cmds:
      - npm run dev

  gen:
    desc: Regenerate backend/openapi.json from the PHP attributes, then the frontend's API types from it
    cmds:
      - cd backend && composer docs
      - cd frontend && npm run gen:types

  build:
    desc: Build the SPA into frontend/dist
    dir: frontend
    cmds:
      - npm run build

  build:plugin:
    desc: Build the FFXIV plugin in Release against this machine's Dalamud (XIVLauncher)
    cmds:
      - dotnet build plugin/TarotGen.Plugin/TarotGen.Plugin.csproj --configuration Release
      - dotnet build plugin/TarotGen.Plugin.Preview/TarotGen.Plugin.Preview.csproj --configuration Release

  preview:plugin:
    desc: Draw each of the plugin's windows to a picture in plugin/previews, with stand-in data and no game (-- <folder> <font scale> to change either)
    cmds:
      - dotnet run --project plugin/TarotGen.Plugin.Preview/TarotGen.Plugin.Preview.csproj -- {{.CLI_ARGS}}

  test:
    desc: Run every test - Vitest, PHPUnit, the plugin's, then the Playwright suite
    aliases: [tests]
    cmds:
      - task: test:unit
      - task: test:e2e

  test:unit:
    desc: Run the frontend (Vitest), backend (PHPUnit) and plugin (xUnit) tests
    aliases: [tests:unit]
    cmds:
      - task: test:frontend
      - task: test:backend
      - task: test:plugin

  test:frontend:
    desc: Run the frontend's Vitest tests
    aliases: [tests:frontend]
    dir: frontend
    cmds:
      - npm test

  test:backend:
    desc: Run the backend's PHPUnit tests (unit and HTTP)
    aliases: [tests:backend]
    dir: backend
    cmds:
      - composer test

  # From plugin/, where global.json selects Microsoft.Testing.Platform, which xUnit v3 runs on.
  test:plugin:
    desc: Run the plugin's tests (everything in Core/, with no Dalamud)
    aliases: [tests:plugin]
    dir: plugin
    cmds:
      - dotnet test --project TarotGen.Plugin.Tests

  test:e2e:
    desc: Run the Playwright suite (it builds the SPA) on the real API, on a throwaway database
    aliases: [tests:e2e, test:smoke, tests:smoke]
    dir: frontend
    cmds:
      - npm run test:e2e

  # The floors CI holds: Vitest's thresholds in frontend/vite.config.ts, and PHPUnit's line
  # and method floors in backend/composer.json's test:coverage (Xdebug or pcov locally).
  test:coverage:
    desc: Run the Vitest and PHPUnit tests with coverage, failing below CI's floors
    cmds:
      - cd frontend && npm run test:coverage
      - cd backend && composer test:coverage

  # The committed OpenAPI spec is what the PHP attributes make, and the frontend's API types
  # are what that spec makes.
  generate:check:
    desc: Fail if backend/openapi.json or frontend/src/types/api.generated.ts differs from what the code generates
    cmds:
      - cd backend && composer docs:check
      - cd frontend && npm run gen:check

  web:specs:
    desc: Type-check the frontend's Vitest specs under its tsconfig.vitest.json, as CI does
    cmds:
      - task: shared:web:specs
        vars: { DIR: frontend }

  lint:
    desc: Lint, format-check, type-check, and statically analyse everything, the shared docs checks included
    cmds:
      - task: lint:frontend
      - task: lint:backend
      - task: lint:plugin
      - task: lint:scripts
      - task: shared:docs:check

  lint:frontend:
    dir: frontend
    cmds:
      - npm run type-check
      - npm run lint
      - npm run lint:css
      - npm run knip
      - npm run format:check

  lint:backend:
    dir: backend
    cmds:
      - composer normalize:check
      - composer deps:check
      - composer lint
      - composer rector:check
      - composer stan

  lint:plugin:
    cmds:
      - dotnet format plugin/TarotGen.Plugin/TarotGen.Plugin.csproj --verify-no-changes
      - dotnet format plugin/TarotGen.Plugin.Tests/TarotGen.Plugin.Tests.csproj --verify-no-changes
      - dotnet format plugin/TarotGen.Plugin.Preview/TarotGen.Plugin.Preview.csproj --verify-no-changes

  # PSScriptAnalyzer, with the shared settings, on every tracked script (the local
  # deploy.config.ps1 is untracked). Install it once with
  # Install-PSResource PSScriptAnalyzer -Version 1.25.0 -Scope CurrentUser -TrustRepository
  lint:scripts:
    cmds:
      - task: shared:lint:scripts

  vuln:
    desc: Check dependencies for known vulnerabilities (Composer, npm's shipped packages, and OSV-Scanner over every lockfile and requirements file)
    cmds:
      - cd backend && composer audit
      - cd frontend && npm audit --audit-level=high --omit=dev
      - task: shared:vuln

  # Everything CI runs. The generated files are checked first, since gen:check rewrites the
  # frontend's API types that the type-check reads; then the steps that don't depend on each
  # other run at once, each line prefixed with its task; then the end-to-end suite, which
  # builds the SPA.
  check:
    desc: Everything CI runs - the generated files, lint and the docs checks, the specs' type-check, every test with its coverage floor, the audits, then the end-to-end suite
    cmds:
      - task: generate:check
      - task --parallel --output prefixed lint web:specs test:coverage test:plugin vuln
      - task: test:e2e

  push:
    desc: Take the in-range updates Dependabot would open, then push and follow CI to its verdict (CI does the checking; run task check first)
    interactive: true
    cmds:
      - task: shared:push

  # task deploy ships everything, in order, and each part also deploys alone. The
  # plugin goes last, and only when its version is new.
  deploy:
    desc: Deploy everything - the backend and the SPA in one upload, then the plugin if its version is new (pass flags after --, e.g. -- -NoDbPull)
    cmds:
      - pwsh -NoProfile -File scripts/deploy.ps1 -Target both {{.CLI_ARGS}}
      - pwsh -NoProfile -File scripts/deploy.ps1 -Target plugin -IfNewer {{.CLI_ARGS}}

  deploy:frontend:
    desc: Build and deploy the SPA only (pass flags after --, e.g. -- -Force)
    cmds:
      - pwsh -NoProfile -File scripts/deploy.ps1 -Target frontend {{.CLI_ARGS}}

  deploy:backend:
    desc: Deploy the PHP backend only, run its migrations, then check the site (pass flags after --, e.g. -- -NoDbPull)
    cmds:
      - pwsh -NoProfile -File scripts/deploy.ps1 -Target backend {{.CLI_ARGS}}

  deploy:plugin:
    desc: Build the FFXIV plugin and publish it to the site's plugin repo; refused unless its version is new
    cmds:
      - pwsh -NoProfile -File scripts/deploy.ps1 -Target plugin {{.CLI_ARGS}}
